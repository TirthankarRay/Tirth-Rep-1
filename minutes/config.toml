# Minutes Configuration
# See https://github.com/silverstein/minutes for full documentation

[watch]
paths = [
    "/data/inbox",
]
dictation_threshold_secs = 120

[summarization]
engine = "agent"
agent_command = "claude"

[storage]
meetings_dir = "/data/meetings"

[server]
port = 3100
host = "0.0.0.0"
