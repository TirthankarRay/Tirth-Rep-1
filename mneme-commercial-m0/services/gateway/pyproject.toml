[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-gateway"
version = "0.1.0"
description = "Mneme MCP gateway — the only contract agents speak to the vault"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    "GitPython>=3.1",
    "sentence-transformers>=2.7",
    "mneme-classifier",
    "mneme-schemas",
    "mneme-index-sync",
]

[tool.setuptools.packages.find]
where = ["src"]
