[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-validator"
version = "0.1.0"
description = "Mneme validator — schema/source check + merge-after-signoff worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "python-frontmatter>=1.1",
    "GitPython>=3.1",
    "httpx>=0.27",
    "mneme-classifier",
    "mneme-schemas",
]

[tool.setuptools.packages.find]
where = ["src"]
