[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-console-api"
version = "0.1.0"
description = "Mneme console backend — reviewer queue, proposal detail, signoff"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "mneme-validator",
]

[tool.setuptools.packages.find]
where = ["src"]
