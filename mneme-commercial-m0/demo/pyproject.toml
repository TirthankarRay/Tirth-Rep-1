[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-demo"
version = "0.1.0"
description = "Mneme demo runner — six simulated agents across three modes"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mneme-schemas",
    "mneme-classifier",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mneme_demo" = ["**/*.md"]
